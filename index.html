<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>심해 다이버</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a1220;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 340px; height: 600px;
    max-width: 100vw; max-height: 100vh;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  canvas#game {
    display: block;
    width: 100%; height: 100%;
    background: #04070d;
    touch-action: none;
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 12px;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }

  /* ---- 좌상단: 놋쇠 원통형 산소/깊이 게이지 ---- */
  #gaugeStack { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  #depthReadout {
    position: relative;
    min-width: 78px;
    padding: 7px 14px 7px 16px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #3a2405;
    text-shadow: 0 1px 0 rgba(255,235,180,0.5);
    background:
      repeating-linear-gradient(180deg,
        rgba(255,255,255,0.35) 0px, rgba(255,255,255,0.05) 2px,
        rgba(0,0,0,0.08) 3px, rgba(255,255,255,0.05) 4px),
      linear-gradient(180deg, #f3d675 0%, #c99a2e 30%, #8a6416 55%, #c99a2e 80%, #7a5610 100%);
    border: 1px solid #5c3f0c;
    box-shadow:
      inset 0 1px 2px rgba(255,246,210,0.8),
      inset 0 -2px 3px rgba(50,30,0,0.55),
      0 2px 5px rgba(0,0,0,0.45);
  }
  #depthReadout::before {
    content: '';
    position: absolute; left: 4px; top: 3px; right: 4px; height: 40%;
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
    pointer-events: none;
  }
  #healthReadout {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 14px;
    background: rgba(10, 18, 32, 0.55);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(4px);
  }

  /* ---- 우상단: 소나(레이더) 스타일 점수 + 도감 ---- */
  #sonarStack { display: flex; flex-direction: column; gap: 7px; align-items: flex-end; }
  #scoreReadout {
    position: relative;
    min-width: 86px;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #8dffc2;
    text-align: right;
    letter-spacing: 0.02em;
    background:
      linear-gradient(rgba(20,60,45,0.35), rgba(20,60,45,0.35)),
      repeating-linear-gradient(0deg, rgba(90,255,170,0.16) 0px, rgba(90,255,170,0.16) 1px, transparent 1px, transparent 7px),
      repeating-linear-gradient(90deg, rgba(90,255,170,0.16) 0px, rgba(90,255,170,0.16) 1px, transparent 1px, transparent 7px),
      #041008;
    border: 1px solid rgba(120,255,180,0.55);
    box-shadow: 0 0 8px rgba(80,255,170,0.35), inset 0 0 10px rgba(0,0,0,0.6);
    text-shadow: 0 0 4px rgba(120,255,180,0.8);
    overflow: hidden;
  }
  #scoreReadout::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: 4px; height: 10px;
    background:
      linear-gradient(90deg, transparent 0%, rgba(110,255,180,0.9) 50%, transparent 100%);
    clip-path: polygon(0% 100%, 8% 100%, 14% 30%, 20% 100%, 30% 100%, 36% 60%, 42% 100%, 55% 100%, 62% 15%, 68% 100%, 100% 100%, 100% 100%, 0 100%);
    opacity: 0.8;
  }
  #dexReadout {
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    color: #f0e0c0;
    background: linear-gradient(180deg, #6b4a2c, #43301c);
    border: 1px solid rgba(255,220,160,0.3);
    box-shadow: inset 0 1px 1px rgba(255,230,190,0.3), 0 1px 3px rgba(0,0,0,0.4);
    display: flex; align-items: center; gap: 4px;
  }
  #dexReadout::before { content: '📖'; font-size: 13px; filter: drop-shadow(0 0 2px rgba(255,220,160,0.6)); }

  #touchControls {
    position: absolute; left: 0; right: 0; bottom: 16px;
    display: flex; justify-content: space-between;
    padding: 0 14px;
    pointer-events: none;
  }
  #touchControls button {
    pointer-events: auto;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid #7c8a99;
    background:
      radial-gradient(circle at 50% 42%, rgba(140,220,255,0.35), rgba(10,18,32,0.6) 60%),
      linear-gradient(180deg, #3a4756, #1a2530);
    color: #d8f4ff;
    font-size: 22px;
    box-shadow:
      0 0 10px rgba(120,210,255,0.55),
      inset 0 1px 2px rgba(255,255,255,0.35),
      inset 0 -2px 3px rgba(0,0,0,0.5);
    text-shadow: 0 0 6px rgba(140,220,255,0.9);
    backdrop-filter: blur(2px);
  }
  #touchControls button:active {
    background:
      radial-gradient(circle at 50% 42%, rgba(140,220,255,0.55), rgba(10,18,32,0.7) 60%),
      linear-gradient(180deg, #4a5b6e, #22303d);
    box-shadow: 0 0 16px rgba(140,220,255,0.85), inset 0 1px 2px rgba(255,255,255,0.4);
  }
  #overlay {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
    background: rgba(4, 8, 16, 0.82);
    color: #eaf3ff;
    text-align: center;
    padding: 24px;
  }
  #overlay.show { display: flex; }
  #overlay h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: 0.02em; }
  #overlay .stat { font-size: 15px; opacity: 0.9; margin: 2px 0; }
  #overlay button {
    margin-top: 16px;
    padding: 10px 22px;
    border-radius: 999px;
    border: none;
    background: #3fa9dc;
    color: #04121f;
    font-weight: 700;
    font-size: 15px;
  }
  #startHint {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    color: #eaf3ff; text-align: center; padding: 24px;
    background: rgba(4,8,16,0.7);
  }
  #startHint.hide { display: none; }
  #startHint button {
    margin-top: 14px; padding: 10px 22px; border-radius: 999px; border: none;
    background: #3fa9dc; color: #04121f; font-weight: 700; font-size: 15px;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="340" height="600"></canvas>

  <div id="hud">
    <div id="gaugeStack">
      <div id="depthReadout">0 m</div>
      <div id="healthReadout">❤️❤️❤️</div>
    </div>
    <div id="sonarStack">
      <div id="scoreReadout">점수 0</div>
      <div id="dexReadout">도감 0/28</div>
    </div>
  </div>

  <div id="touchControls">
    <button id="btnLeft" aria-label="왼쪽으로">◀</button>
    <button id="btnRight" aria-label="오른쪽으로">▶</button>
  </div>

  <div id="startHint">
    <h1 style="margin:0;">심해 다이버</h1>
    <div class="stat">실종된 잠수정을 찾아 심해로 내려가세요</div>
    <div class="stat">방향키/WASD 또는 드래그로 상하좌우 이동</div>
    <button id="btnStart">하강 시작</button>
  </div>

  <div id="overlay">
    <h1>조난</h1>
    <div class="stat" id="finalDepth">도달 깊이 0 m</div>
    <div class="stat" id="finalScore">수집 점수 0</div>
    <div class="stat" id="finalDex">관찰한 종 0/28</div>
    <button id="btnRestart">다시 하강</button>
  </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
