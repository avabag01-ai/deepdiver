<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>심해 다이버</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a1220;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 340px; height: 600px;
    max-width: 100vw; max-height: 100vh;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  canvas#game {
    display: block;
    width: 100%; height: 100%;
    background: #04070d;
    touch-action: none;
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 12px;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #hud .pill {
    background: rgba(10, 18, 32, 0.55);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8f2ff;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    backdrop-filter: blur(4px);
  }
  #depthReadout { font-size: 15px; }
  #dexReadout { opacity: 0.85; }
  #scoreReadout { opacity: 0.85; }
  #touchControls {
    position: absolute; left: 0; right: 0; bottom: 16px;
    display: flex; justify-content: space-between;
    padding: 0 14px;
    pointer-events: none;
  }
  #touchControls button {
    pointer-events: auto;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(10, 18, 32, 0.5);
    color: #e8f2ff;
    font-size: 22px;
    backdrop-filter: blur(4px);
  }
  #touchControls button:active { background: rgba(255,255,255,0.18); }
  #overlay {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
    background: rgba(4, 8, 16, 0.82);
    color: #eaf3ff;
    text-align: center;
    padding: 24px;
  }
  #overlay.show { display: flex; }
  #overlay h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: 0.02em; }
  #overlay .stat { font-size: 15px; opacity: 0.9; margin: 2px 0; }
  #overlay button {
    margin-top: 16px;
    padding: 10px 22px;
    border-radius: 999px;
    border: none;
    background: #3fa9dc;
    color: #04121f;
    font-weight: 700;
    font-size: 15px;
  }
  #startHint {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    color: #eaf3ff; text-align: center; padding: 24px;
    background: rgba(4,8,16,0.7);
  }
  #startHint.hide { display: none; }
  #startHint button {
    margin-top: 14px; padding: 10px 22px; border-radius: 999px; border: none;
    background: #3fa9dc; color: #04121f; font-weight: 700; font-size: 15px;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="340" height="600"></canvas>

  <div id="hud">
    <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-start;">
      <div class="pill" id="depthReadout">0 m</div>
      <div class="pill" id="healthReadout">❤️❤️❤️</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
      <div class="pill" id="scoreReadout">점수 0</div>
      <div class="pill" id="dexReadout">도감 0/28</div>
    </div>
  </div>

  <div id="touchControls">
    <button id="btnLeft" aria-label="왼쪽으로">◀</button>
    <button id="btnRight" aria-label="오른쪽으로">▶</button>
  </div>

  <div id="startHint">
    <h1 style="margin:0;">심해 다이버</h1>
    <div class="stat">실종된 잠수정을 찾아 심해로 내려가세요</div>
    <div class="stat">방향키/WASD 또는 드래그로 상하좌우 이동</div>
    <button id="btnStart">하강 시작</button>
  </div>

  <div id="overlay">
    <h1>조난</h1>
    <div class="stat" id="finalDepth">도달 깊이 0 m</div>
    <div class="stat" id="finalScore">수집 점수 0</div>
    <div class="stat" id="finalDex">관찰한 종 0/28</div>
    <button id="btnRestart">다시 하강</button>
  </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
